<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crashtech Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #spinner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #spinner.active {
            display: flex;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        .title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .title-text {
            display: block;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .content {
            padding: 40px 30px;
        }

        .user-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .details {
            font-weight: 500;
            margin-bottom: 8px;
            color: #2d3748;
            font-size: 14px;
        }

        .details span {
            color: #e53e3e;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="tel"] {
            height: 45px;
            width: 100%;
            padding: 0 15px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.error {
            border-color: #e53e3e;
            background: #fff5f5;
        }

        .qualifications {
            margin-bottom: 30px;
        }

        .qualification-title {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            display: block;
        }

        .class-section-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .button {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        input[type="button"] {
            height: 50px;
            width: 100%;
            max-width: 300px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        input[type="button]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        input[type="button]:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                border-radius: 15px;
            }

            .title {
                padding: 30px 20px;
            }

            .title-text {
                font-size: 24px;
            }

            .content {
                padding: 30px 20px;
            }

            .user-details {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .class-section-row {
                grid-template-columns: 1fr;
            }

            input[type="button"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="spinner">
        <img src="ajax-loader.gif" alt="Loading..."/>
    </div>
    <div class="container">
        <div class="title">
            <img src="/logo/Crashtech logo only without background Small Size.png" alt="crashtech logo" class="logo">
            <span class="title-text">Welcome to Crashtech</span>
        </div>
        <div class="content">
            <form id="form" name="form" action="#">
                <div class="user-details">
                    <div class="input-box form-control">
                        <span class="details">Full Name<span>*</span></span>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            onkeyup="validate(event)"
                            class="isRequired"
                        />
                    </div>
                    <div class="input-box">
                        <span class="details">Date of Birth<span>*</span></span>
                        <input class="isRequired" type="date" id="dob"/>
                    </div>
                    <div class="input-box form-control">
                        <span class="details">Email</span>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            onkeyup="validate(event)"
                        />
                    </div>
                    <div class="input-box form-control">
                        <span class="details">Phone Number<span>*</span></span>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your number"
                            onkeyup="validate(event)"
                            maxlength="13"
                            class="isRequired"
                        />
                    </div>
                     <div class="input-box class-box">
                            <span class="details">Class<span>*</span></span>
                            <input type="text" id="class" placeholder="Enter your class" class="isRequired" />
                        </div>
                        <div class="input-box section-box">
                            <span class="details">Section<span>*</span></span>
                            <input type="text" id="section" placeholder="Enter your section" class="isRequired" />
                        </div>
                <!-- <div class="qualifications">
                    <span class="qualification-title">Latest Qualification</span>
                    <div class="class-section-row">
                        <div class="input-box class-box">
                            <span class="details">Class<span>*</span></span>
                            <input type="text" id="class" placeholder="Enter your class" class="isRequired" />
                        </div>
                        <div class="input-box section-box">
                            <span class="details">Section<span>*</span></span>
                            <input type="text" id="section" placeholder="Enter your section" class="isRequired" />
                        </div>
                    </div>
                </div> -->
                    <div class="input-box">
                        <span class="details">School/College/University<span>*</span></span>
                        <input type="text" id="institute" placeholder="Institute name" class="isRequired" value="Galaxy High School" onkeyup="validate(event)"/>
                    </div>
                    <div class="input-box">
                        <span class="details">Present City</span>
                        <input type="text" id="city" placeholder="Enter your city name" value="Hazaribagh" />
                    </div>
                </div>
                <div class="button">
                    <input type="button" id="submit" value="Register" />
                </div>
            </form>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
